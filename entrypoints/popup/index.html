<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calimoto Poweride</title>
  <meta name="manifest.type" content="browser_action" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <header>
    <img src="/icon/32.png" class="icon" alt="" /> Calimoto Poweride
  </header>
  <section>
    <div class="option-list">
      <div class="option-item">
        <div class="option-item__input">
          <label class="switch">
            <input type="checkbox" id="markerLinks" class="saveOnChange" />
            <span class="slider round"></span>
          </label>
        </div>
        <label class="option-item__description" for="markerLinks">
          Links to Maps and Waze
          <small>Display external links on the map popup</small>
        </label>
      </div>

      <div class="option-item">
        <div class="option-item__input">
          <label class="switch">
            <input type="checkbox" id="routeProfiles" class="saveOnChange" />
            <span class="slider round"></span>
          </label>
        </div>
        <label class="option-item__description" for="routeProfiles">
          Route type selector
          <small>Apply route type to every waypoint at once</small>
        </label>
      </div>

      <div class="option-item">
        <div class="option-item__input">
          <label class="switch">
            <input type="checkbox" id="smallerFont" class="saveOnChange" />
            <span class="slider round"></span>
          </label>
        </div>
        <label class="option-item__description" for="smallerFont">
          Smaller font size
          <small>Reduce global font size for better readability</small>
        </label>
      </div>

      <div class="option-item">
        <div class="option-item__input">
          <label class="switch">
            <input type="checkbox" id="biggerSearchbar" class="saveOnChange" />
            <span class="slider round"></span>
          </label>
        </div>
        <label class="option-item__description" for="biggerSearchbar">
          Bigger map searchbar
          <small>Increase searchbar size to display more text</small>
        </label>
      </div>
    </div>

    <div class="saved hidden" id="refresh">
      <span class="green">Settings saved.</span>
      <small>You can reload Calimoto.</small>
    </div>
  </section>
  <script type="module" src="./main.ts"></script>
</body>

</html>
